[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syndual"
version = "0.2.0"
description = "Synthesis-aware molecular generation with GP-MoLFormer and a SynLaD-v4 route decoder"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.32.1,<4.45",
    "tokenizers>=0.13.3",
    "accelerate>=0.23",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "rdkit>=2023.9",
]

[tool.setuptools.packages.find]
include = ["syndual*"]

# SynDual Stage III V4: V3A + PH4 auxiliary pocket grounding
# Specificity Recovery for the Factorized Position-Preserving Dual-Pocket Adapter
#
# OOD rationale from Stage-3 v2:
#   * Set1 val/test are already Bemis-Murcko scaffold-disjoint from train.
#   * Test T0 (seen target pair) transferred much better than T1
#     (new pair of two individually seen targets), exposing weak compositional
#     target-pair generalization.
#   * v2 zero-prefix NLL was far above unconditional NLL, showing that
#     prepending virtual tokens disturbed the frozen GP-MoLFormer positions.
#
# V3 therefore:
#   1) preserves the original SMILES length/positions;
#   2) factorizes A-only, B-only and A/B interaction conditioning;
#   3) adds single-pocket auxiliary grounding;
#   4) keeps v2 A/B/Both hard-negative ranking.

seed: 20260812
device: auto

model:
  # Set2-trained SynthesisAwareModel / GP-MoLFormer-Uniq checkpoint.
  # Train v3 FROM STAGE 2, not from a v2 pocket-adapter checkpoint.
  stage2_checkpoint: ../runs/stage2_joint_v4/best

  stage3_output_dir: ../outputs/stage3_v4_ph4_aux
  stage3_checkpoint: ../outputs/stage3_v4_ph4_aux/best

  conditioning_mode: position_preserving
  conditioning_probe_report: ../outputs/stage3_v4_ph4_aux/conditioning_probe.json

data:
  # Existing Set1 scaffold split. Do NOT re-split.
  split_root: /home/xukai_cluster/3D_Mol/synlad/boltz2_postprocessing_v4_2d_ph4_routefixed/dataset_v4_clean/splits_v2_set1_scaffold_set2_identity

  # Produced by postprocess_boltz2_complexes_v4_2d_ph4_dualtarget_routefixed.ipynb.
  pocket_context_csv: /home/xukai_cluster/3D_Mol/synlad/boltz2_postprocessing_v4_2d_ph4_routefixed/pocket_context_8A.csv

  # Built from consensus_pharmacophore_v3.csv by scripts/08b_build_ph4_aux_targets.py.
  ph4_aux_target_csv: /home/xukai_cluster/3D_Mol/synlad/boltz2_postprocessing_v4_2d_ph4_routefixed/ph4_aux_targets_v4.csv

  strict_pocket_metadata: true
  alignment_output_dir: ../outputs/stage3_alignment

pocket:
  max_residues: 128
  use_core_flag: false

adapter:
  # backbone_dim is read automatically from GP-MoLFormer-Uniq.
  pocket_dim: 256
  num_layers: 3
  num_rbf: 32
  rbf_max_distance: 24.0
  num_queries: 8
  num_heads: 8
  conditioning_heads: 8
  dropout: 0.0
  use_core_flag: false

  # Reusable A/B semantics start stronger than pair-specific interaction.
  single_gate_init: -2.0
  joint_gate_init: -3.0

  # Training-only PH4 prediction head; never used as an inference condition.
  ph4_aux_enabled: true
  ph4_num_types: 6
  ph4_hidden_dim: 256
  ph4_dropout: 0.0

# Pharmacophore auxiliary supervision. The default formal V4 policy is
# positive_only: PH4 loss is applied only to the true A/B pocket states.
# Hard negatives remain exactly the V3A ranking controls.
ph4_auxiliary:
  enabled: true
  lambda: 0.05
  num_types: 6
  hidden_dim: 256
  dropout: 0.0
  negative_policy: positive_only   # optional ablation: own_label
  target_semantics: max_all_qc_interaction_frequency
  absent_type_policy: mask_not_zero

# Existing V3A hard-negative objective is retained unchanged.
ranking:
  enabled: true
  lambda: 0.20
  margin: 0.05
  types: [a, b, both]

# OOD-motivated individual-pocket grounding.
# Each dual-target positive (A,B,M) also supervises (A,M) and (B,M).
single_grounding:
  enabled: true
  lambda: 0.20
  sides: [a, b]

  # Short warm-up emphasizes reusable single-pocket semantics before the full
  # joint/ranking objective. Disable with warmup_epochs: 0 for an ablation.
  warmup_epochs: 3
  warmup_single_lambda: 1.0
  warmup_joint_weight: 0.25
  warmup_rank_weight: 0.0

# V3.1 specificity recovery.
# Single-pocket ranking prevents A-only/B-only conditioning from becoming a
# generic Set1/domain correction. Hard negatives remain ligand-disjoint.
single_ranking:
  enabled: true
  lambda: 0.20
  margin: 0.05
  sides: [a, b]
  warmup_weight: 0.50

# Ligand-macro validation only; test is never used for checkpoint selection.
# V3A model selection is preserved exactly: ligand-macro conditional NLL only.
# PH4 prediction quality is logged as a diagnostic and never selects checkpoints.
model_selection:
  aggregation: ligand_macro
  mode: metric
  metric: conditional_nll
  base_metric: conditional_nll
  # dual_specificity_beta: 0.20
  # single_specificity_beta: 0.10
  # dual_specificity_metrics: [delta_a_nll, delta_b_nll, delta_both_nll]
  # single_specificity_metrics: [single_delta_a_nll, single_delta_b_nll]

training:
  batch_size: 8
  num_workers: 0
  max_smiles_length: 192
  epochs: 30
  early_stopping_patience: 6
  lr: 0.0002
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  grad_clip: 1.0

  # Keep FP32: real v1 prefix training showed non-finite FP16 losses.
  amp: false
  overwrite_train_log: true

generation:
  num_molecules: 32
  batch_size: 16
  max_attempts: 50
  smiles_max_length: 160
  smiles_temperature: 1.0
  smiles_top_k: null
  smiles_top_p: 0.95
  smiles_do_sample: true
  start_token_id: null
  end_token_id: null
  require_valid_smiles: true
  unique_smiles: true

  route_forward_only: true
  route_do_sample: false
  route_temperature: 1.0
  route_top_k: null

  bb_constrained_decoding: false
  building_block_vocab_path: null
  reactant_graph_constrained_decoding: true

  validity_aware_decoding:
    primary_do_sample: false
    repair_beam_width: 4
    repair_candidate_pool_size: 8
    repair_max_tokens: 160
    repair_length_penalty: 0.6
    repair_temperature: 1.0
    repair_top_k: null

  output_file: ../outputs/stage3_v4_ph4_generated.jsonl
